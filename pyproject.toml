[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sjtu-tennis-toolkit"
version = "1.0.0"
description = "交我办网球场监控与抢场工具集 — SJTU Tennis Toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44,<2",
    "Pillow>=10,<12",
]

[project.scripts]
sjtu-tennis = "sjtu_tennis_toolkit.__main__:main"

[tool.setuptools.packages.find]
include = ["sjtu_tennis_toolkit*"]
